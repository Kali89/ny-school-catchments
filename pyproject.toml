[project]
name = "ny-school-catchments"
version = "0.1.0"
description = "Average house price by school catchment area in North Yorkshire"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ny_catchments"]

[tool.ruff]
line-length = 100
